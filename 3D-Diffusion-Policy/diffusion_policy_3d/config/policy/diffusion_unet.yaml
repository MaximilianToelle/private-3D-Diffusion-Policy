# The diffusion U-Net every policy of this repository shares: time horizons, conditioning,
# noise scheduler. A policy file (dp3.yaml, gsplat_dp3.yaml) adds its frame, its observation
# encoder and its network class.
# NOTE: an inheritance parent, never selected directly as `policy=`.

horizon: 16          # actions predicted per inference
n_obs_steps: 2       # observations the policy is conditioned on
n_action_steps: 8    # predicted actions executed before the next inference

network:
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  diffusion_step_embed_dim: 128
  down_dims:
  - 256
  - 512
  - 1024
  encoder_output_dim: 128
  horizon: ${policy.horizon}
  kernel_size: 5
  n_action_steps: ${policy.n_action_steps}
  n_groups: 8
  n_obs_steps: ${policy.n_obs_steps}
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: sample
  num_inference_steps: 10
  obs_as_global_cond: true
  shape_meta: ${shape_meta}
