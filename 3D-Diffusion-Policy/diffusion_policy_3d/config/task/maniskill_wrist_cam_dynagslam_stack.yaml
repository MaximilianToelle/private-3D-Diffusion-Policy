defaults:
  - maniskill_wrist_cam_gs_base
  - _self_

# DynaGSLAM variant of the wrist-cam stack task: the Gaussians come from DynaGSLAM's online
# reconstruction of the wrist camera's RGB-D stream instead of GSWorld's pre-scanned model.
# SLAM parameters live in config/scene_representation/dynagslam.yaml, composed via the
# wrist_cam_dynagslam_gsplat_dp3 defaults list.

name: maniskill_wrist_cam_dynagslam_stack

env_runner:
  task_name: StackFr3WristCamSimpleEnv-v1

  # Builds the perception-head wrappers; the env_runner appends shared wrappers.
  # Add all perception-specific params, env_runner injects base_env and device.
  maniskill_env_obs_wrapper_builder:
    _target_: diffusion_policy_3d.env_runner.maniskill_env_obs_wrapper_builder.wrist_cam_dynagslam
    _partial_: true
    representation_space: ${task.representation_space}
    agent_proprio_dim: ${task.shape_meta.obs.agent_proprio.shape[0]}
    cam_name: wrist_cam
    scene_representation: ${scene_representation}
    num_gaussians: ${task.num_gaussians}
    min_opacity: ${task.min_opacity}
    use_gsplat_viewer: false

  callbacks:
    - _target_: diffusion_policy_3d.env_runner.maniskill_callbacks.VideoSavingCallback
      fps: 10
      add_attention_legend: false   # only feasible with GaussianAttentionPlotCallback
    - _target_: diffusion_policy_3d.env_runner.maniskill_callbacks.TrajectoryPlotCallback
      representation_space: ${task.representation_space}

