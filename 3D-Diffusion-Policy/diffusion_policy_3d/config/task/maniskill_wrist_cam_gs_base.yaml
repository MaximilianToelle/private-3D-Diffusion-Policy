defaults:
  - maniskill_wrist_cam_stack
  - _self_

# The gs_* observation contract of the wrist-cam stack task, shared by every source of
# Gaussians: GSWorld's pre-scanned model (…_gsworld_stack) and DynaGSLAM's online reconstruction
# (…_dynagslam_stack). Leaves fill the ??? keys: obs-wrapper builder, callbacks, dataset class and paths.
# NOTE: this is an inheritance parent, never selected directly as `task=`.

name: maniskill_wrist_cam_gs_base

num_gaussians: 1024
min_opacity: 0.98

# gets merged with agent_proprio / action entries defined in maniskill_base.
shape_meta: &shape_meta
  obs:
    gs_positions:
      shape:
        - ${task.num_gaussians}
        - 3
      type: spatial
    point_cloud:            # aliased to gs_positions at eval (obs_key_aliases)
      shape:
        - ${task.num_gaussians}
        - 3
      type: spatial
    gs_rotations_9d:
      shape:
        - ${task.num_gaussians}
        - 9
      type: spatial
    gs_surface_normals:
      shape:
        - ${task.num_gaussians}
        - 3
      type: spatial
    gs_log_scales:
      shape:
        - ${task.num_gaussians}
        - 3
      type: spatial
    gs_opacities:
      shape:
        - ${task.num_gaussians}
        - 1
      type: spatial
    gs_rgb:
      shape:
        - ${task.num_gaussians}
        - 3
      type: spatial

env_runner:
  # For running pcd baseline on Gaussian means
  obs_key_aliases:
    point_cloud: gs_positions

  # Builds the perception-head wrappers; the env_runner appends shared wrappers
  # Add all perception-specific params, env_runner injects base_env and device
  maniskill_env_obs_wrapper_builder: ???

  # Logging / visualization.
  callbacks: ???
    
dataset:
  _target_: ???
  # One entry per converted dataset
  dataset_path: ???
  
  representation_space: ${task.representation_space}
  min_opacity: ${task.min_opacity}
  num_gaussians: ${task.num_gaussians}
  # relative_ee_pose percentile stats: histogram over anchor-relative positions.
  # bin width = 2 * range / num_bins = 1.4e-6 m. Do NOT override per sweep -- the same
  # estimator constants across all runs are what keeps normalizations comparable.
  percentile_histogram_range: 3.0
  percentile_histogram_num_bins: ${eval:'2 ** 22'}

# train_data_augmentations / val_data_augmentations default to [] in maniskill_base.
# If needed, override here with GPU augmentations from dataset/data_augmentations.py
# (list entries get chained and executed in sequence).
# NOTE: WristCamGSMemmapManiskillDataset does active+high-opacity filter and downsample to num_gaussians on the cpu
