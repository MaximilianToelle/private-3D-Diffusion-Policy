defaults:
  - maniskill_gs_stack  
  - _self_              

name: maniskill_wrist_cam_gs_stack

env_runner:
  _target_: diffusion_policy_3d.env_runner.maniskill_wrist_cam_gs_runner.WristCamGSManiSkillRunner
  task_name: StackFr3WristCamEnv-v1

dataset:
  _target_: diffusion_policy_3d.dataset.maniskill_wrist_cam_gs_dataset.WristCamGSManiskillDataset
  zarr_path: /home/max/projects/gsplat_policy/datasets/gsplat_3d_diffusion_policy/stack_wrist_cam_surface_normals

train_augmentations:
  - _target_: diffusion_policy_3d.dataset.data_augmentations.GaussianFPSAndBallQuery
    num_samples: ${task.dataset.num_gaussians}
    radius: 0.02
    max_neighbors: 16

eval_augmentations:
  - _target_: diffusion_policy_3d.dataset.data_augmentations.GaussianFPS
    num_samples: ${task.dataset.num_gaussians}