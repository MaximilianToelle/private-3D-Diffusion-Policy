# The point-cloud observation contract shared by both point-cloud heads, the current frame's
# cloud (single_step_pcd) and the cloud accumulated over the episode (spatial_memory_pcd), on
# every scene. A leaf inherits a scene layer (e.g. …_stack) and this file, and fills the
# ??? keys: the obs-wrapper builder that names the head, and the dataset paths.
# NOTE: this is an inheritance parent, never selected directly as `task=`.

name: maniskill_wrist_cam_pcd_base

# Point clouds are only supported with abs_joint_pos — the pcd obs-wrapper builders
# reject relative_ee_pose (RelativeEEControlWrapper only transforms gs_* keys).
representation_space: abs_joint_pos

# The chosen scene-representation params (num_points, num_pool_points, …) live in
# config/scene_representation/<head>.yaml (composed via the train config's defaults list) — the
# single source shared by the dataset converter and the eval builder, which asserts it equals
# the value stamped into the dataset at conversion.
num_points: ${scene_representation.num_points}

# gets merged with agent_proprio / action entries defined in maniskill_base.
shape_meta: &shape_meta
  obs:
    point_cloud:
      shape:
        - ${task.num_points}
        - 3
      type: point_cloud

env_runner:
  # Builds the perception-head wrappers; the env_runner appends shared wrappers.
  # Add all perception-specific params, env_runner injects base_env and device.
  maniskill_env_obs_wrapper_builder:
    _target_: ???   # …maniskill_env_obs_wrapper_builder.single_step_pcd | .spatial_memory_pcd
    _partial_: true
    representation_space: ${task.representation_space}
    agent_proprio_dim: ${task.shape_meta.obs.agent_proprio.shape[0]}
    cam_name: wrist_cam
    scene_representation: ${scene_representation}
    dataset_path: ${task.dataset.dataset_path}

  # Logging / visualization.
  callbacks:
    - _target_: diffusion_policy_3d.env_runner.maniskill_callbacks.VideoSavingCallback
      fps: 10
      add_attention_legend: false  # only feasible with GaussianAttentionPlotCallback
    - _target_: diffusion_policy_3d.env_runner.maniskill_callbacks.TrajectoryPlotCallback
      representation_space: ${task.representation_space}

dataset:
  _target_: diffusion_policy_3d.dataset.maniskill_wrist_cam_pcd_memmap_dataset.WristCamPCDMemmapManiskillDataset
  # One entry per converted dataset
  dataset_path: ???

# The dataset hands over the stored point pool of every observation step; reducing it to
# num_points happens here, batched on the GPU (~10 ms per batch, against ~0.7 s when the
# dataloader workers sample each cloud on the CPU).
train_data_augmentations:
  - _target_: diffusion_policy_3d.dataset.data_augmentations.PointCloudFPS
    num_points: ${task.num_points}
    random_start_point: true   # a different subset of the same pool in every epoch
val_data_augmentations:
  - _target_: diffusion_policy_3d.dataset.data_augmentations.PointCloudFPS
    num_points: ${task.num_points}
    random_start_point: false  # one fixed subset, so the val loss stays comparable
