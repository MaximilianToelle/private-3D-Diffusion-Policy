defaults:
  - maniskill_base
  - _self_

# Scene layer for the wrist-cam "stack" task, shared by every observation-space variant
# (…_gs_stack, …_pcd_stack, …). It fixes the SAPIEN env; leaf configs add only their
# perception head (shape_meta + obs-wrapper builder + callbacks) and their dataset.
# NOTE: this is an inheritance parent, never selected directly as `task=`.

name: maniskill_wrist_cam_stack

env_runner:
  task_name: StackFr3WristCamEnv-v1   # StackFr3WristCamSimpleEnv-v1 / StackFr3WristCamEnv-v1