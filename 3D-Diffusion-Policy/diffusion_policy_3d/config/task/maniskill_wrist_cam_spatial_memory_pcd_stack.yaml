defaults:
  - maniskill_wrist_cam_stack
  - _self_

name: maniskill_wrist_cam_pcd_stack

# Point clouds are only supported with abs_joint_pos — the pcd obs-wrapper builder
# rejects relative_ee_pose (RelativeEEControlWrapper only transforms gs_* keys).
representation_space: abs_joint_pos

# The chosen scene-representation params (num_points, num_stored_points, voxel_size,
# eliminate_background) live in config/scene_representation/spatial_memory_pcd.yaml
# (composed via the wrist_cam_spatial_memory_dp3 defaults list) — the single source shared by the dataset
# converter and the eval builder, which asserts it equals the value stamped into the zarr
# at conversion.
num_points: ${scene_representation.num_points}

# gets merged with agent_proprio / action entries defined in maniskill_base.
shape_meta: &shape_meta
  obs:
    point_cloud:
      shape:
        - ${task.num_points}
        - 3
      type: point_cloud

env_runner:
  # Builds the perception-head wrappers; the env_runner appends shared wrappers.
  # Add all perception-specific params, env_runner injects base_env and device.
  maniskill_env_obs_wrapper_builder:
    _target_: diffusion_policy_3d.env_runner.maniskill_env_obs_wrapper_builder.spatial_memory_pcd
    _partial_: true
    representation_space: ${task.representation_space}
    agent_proprio_dim: ${task.shape_meta.obs.agent_proprio.shape[0]}
    cam_name: wrist_cam
    scene_representation: ${scene_representation}
    zarr_path: ${task.dataset.zarr_path}

  # Logging / visualization.
  callbacks:
    - _target_: diffusion_policy_3d.env_runner.maniskill_callbacks.VideoSavingCallback
      fps: 10
      add_attention_legend: false  # only feasible with GaussianAttentionPlotCallback
    - _target_: diffusion_policy_3d.env_runner.maniskill_callbacks.TrajectoryPlotCallback
      representation_space: ${task.representation_space}

dataset:
  _target_: diffusion_policy_3d.dataset.maniskill_wrist_cam_spatial_memory_pcd_zarr_dataset.WristCamSpatialMemoryPCDManiskillDataset
  zarr_path: /home/max/projects/gsplat_policy/datasets/spatial_memory_pcd/stack_wrist_cam

# The dataset hands over the full padded memory of every observation step; reducing it to
# num_points happens here, batched on the GPU (~9 ms per batch, against ~0.7 s when the
# dataloader workers sample each cloud on the CPU).
train_data_augmentations:
  - _target_: diffusion_policy_3d.dataset.data_augmentations.PointCloudFPS
    num_points: ${task.num_points}
    random_start_point: true   # a different subset of the same memory in every epoch
val_data_augmentations:
  - _target_: diffusion_policy_3d.dataset.data_augmentations.PointCloudFPS
    num_points: ${task.num_points}
    random_start_point: false  # one fixed subset, so the val loss stays comparable
