# The spatial-memory point-cloud scene representation (spatial_memory_pcd baseline): the wrist
# camera's points accumulated over the episode.
defaults:
  - point_cloud
  - _self_

name: spatial_memory_pcd

# The single source of truth of the representation's parameters: the dataset converter
# (scripts/dataset/conversion/convert_to_spatial_memory_pcd_memmap.py) builds the mapper from them
# and stamps them into the dataset, the observation-wrapper builder asserts they equal the stamp
# -- the dataset was recorded with these values (e.g. voxel size), so evaluating with different
# ones would be silently invalid. Editing them after converting fails loudly: reconvert or revert.
params:
  num_points: 1024            # what the policy consumes, sampled per training batch / live obs
  # The dataset stores, per frame, a farthest-point pool of this many points drawn once from the
  # full deduped memory (padded, with a per-frame valid count, while the memory is still smaller).
  # Farthest-point sampling down to num_points is a separate second stage: the PointCloudFPS
  # augmentation does it batched on the GPU during training, and the observation wrapper runs
  # both stages per step at rollout. Farthest-point sampling costs time proportional to its
  # input: on the full Fast-FoundationStereo memory of HangMugFr3WristCamEnv-v1 (~91k points per
  # frame) one training batch took 669 ms, on this pool 12.5 ms, with the same per-body
  # composition of the final num_points sample (measured 2026-09-22). 98 KB per frame.
  num_pool_points: 8192

  # SpatialMemoryPcdSceneMapper params (baseline_scene_integration/spatial_memory_pcd_scene_mapper.py)
  # 0.004 guarantees the memory exceeds num_points from frame 0 of EVERY episode
  # (measured min 1053 pts at 0.005, ~1650 at 0.004; ~500 at 0.01), so the sampled cloud is
  # always a true farthest-point subset -- never padded with duplicate points.
  voxel_size: 0.003           # per-body dedup voxel edge [m]
  eliminate_background: true  # keep only robot links + movable actors (drop table/ground)

obs_wrapper_builder:
  _target_: diffusion_policy_3d.env_runner.maniskill_env_obs_wrapper_builder.spatial_memory_pcd
  cam_name: wrist_cam
