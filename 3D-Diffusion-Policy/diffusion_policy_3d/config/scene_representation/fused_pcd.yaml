# Shared part of the fused point-cloud scene representations, fused_pcd_dense and fused_pcd_sparse.
# NOTE: an inheritance parent, never selected directly as `scene_representation=`.
#
# Every frame, all cameras are backprojected into the robot base frame (= world frame, the robot
# root sits at the origin) and fused into one cloud with the renderer's surface normal per point.
# The variant selects points (crop_box), the voxel grid keeps one measured point per voxel,
# the one nearest to the voxel center (no averaging, so positions and normals stay real).
defaults:
  - point_cloud
  - _self_

obs_mode: rgb+depth+segmentation+normal   # normals for the fused point cloud, rgb for the evaluation videos

# The single source of truth of the representation's parameters: the dataset converter
# (scripts/dataset/conversion/convert_to_fused_pcd_memmap.py) stamps the composed variant into
# the dataset, the observation-wrapper builder asserts its own composition against that stamp.
params:
  voxel_size: 0.005           # [m]
  num_points: 1024            # what the policy consumes: farthest-point sampled per training batch / live obs
  num_pool_points: 8192       # stored per frame: a uniform random subset of the voxel-downsampled cloud
  # null: only the points the ground-truth segmentation assigns to one of segmented_robot_links or
  # to a moving actor (dense on the piece); [[x, y, z] min, [x, y, z] max]: every point inside
  # this box (sparse on the piece)
  crop_box: null
  segmented_robot_links: []

obs_wrapper_builder:
  _target_: diffusion_policy_3d.env_runner.maniskill_env_obs_wrapper_builder.fused_pcd
  video_cam_name: wrist_cam
