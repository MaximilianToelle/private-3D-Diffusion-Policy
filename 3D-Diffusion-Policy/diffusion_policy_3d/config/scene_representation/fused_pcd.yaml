# Shared part of the fused point-cloud scene representations, fused_pcd_dense, fused_pcd_sparse
# and fused_pcd_phased.
# NOTE: an inheritance parent, never selected directly as `scene_representation=`.
#
# Every frame, all cameras are backprojected into the robot base frame (= world frame, the robot
# root sits at the origin) and fused into one cloud with the renderer's surface normal per point.
# The variant selects points, the voxel grid keeps one measured point per voxel, the one nearest
# to the voxel center (no averaging, so positions and normals stay real); a variant selecting by
# segmentation keeps one per voxel and segmented body.
defaults:
  - point_cloud
  - _self_

# ManiSkill renders nothing in its step: the observation wrapper renders the images of the steps
# whose observation the policy reads, and the video camera's rgb at every step
obs_mode: state_dict

# The single source of truth of the representation's parameters: the dataset converter
# (scripts/dataset/conversion/convert_to_fused_pcd_memmap.py) stamps the composed variant into
# the dataset, the observation-wrapper builder asserts its own composition against that stamp.
params:
  voxel_size: 0.002           # [m], about one static-camera pixel at the piece (2.1 mm)
  num_points: 1024            # what the policy consumes: farthest-point sampled per training batch / live obs
  # stored per frame: the first picks of farthest-point sampling over the voxel-downsampled cloud
  # (fixed start), so sampling num_points from it without a random start equals sampling the whole cloud
  num_pool_points: 8192

obs_wrapper_builder:
  _target_: diffusion_policy_3d.env_runner.maniskill_env_obs_wrapper_builder.fused_pcd
  video_cam_name: static_cam_0
  point_normals: ${scene_representation.point_normals}
