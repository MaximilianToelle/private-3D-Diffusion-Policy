defaults:
  - base_dp3
  - _self_      # _self_ is listed last so values in this file win over the inherited base.

name: train_simple_dp3

policy:
  _target_: diffusion_policy_3d.policy.simple_dp3.SimpleDP3
  down_dims:
  - 128
  - 256
  - 384
  # SimpleDP3-specific: point-cloud cropping + PointNet encoder
  use_point_crop: true
  crop_shape:
  - 80
  - 80
  use_pc_color: false
  pointnet_type: "pointnet"
  pointcloud_encoder_cfg:
    in_channels: 3
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm   # layernorm, none
    normal_channel: false
