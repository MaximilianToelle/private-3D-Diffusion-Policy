# @package _global_
# (an experiment sets keys at the top level of the config, like base.yaml)
# DP3 on the point cloud fused from all cameras, lifting an FMB piece. Launch with the piece and,
# for the sparse variant, the scene representation:
#   python train.py --config-name=experiment/lift_fmb_fused_pcd task.piece=hexagon_large_h100 [scene_representation=fused_pcd_sparse]
defaults:
  - /base
  - /task: lift_fmb
  - /scene_representation: fused_pcd_dense
  - /policy: dp3
  - _self_

name: lift_fmb_fused_pcd

data:
  # one converted dataset per piece and scene representation
  dataset_path: ${repo_root:}/datasets/${scene_representation.name}/${task.piece}
  num_train_episodes: 40
  # [low, high]: validate on the episodes whose start yaw lies inside, train on all others
  # (unseen rotations); needs num_train_episodes: null
  held_out_start_yaw_deg: null
  # one of dataset_path: validate on all its episodes, train on all episodes of the others
  # (an unseen piece, so task.piece must be its piece); needs num_train_episodes: null
  held_out_dataset_path: null
