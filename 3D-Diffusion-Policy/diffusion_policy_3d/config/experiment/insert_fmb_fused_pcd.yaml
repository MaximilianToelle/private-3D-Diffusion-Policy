# @package _global_
# (an experiment sets keys at the top level of the config, like base.yaml)
# DP3 on the point cloud fused from all cameras, inserting an FMB piece into its peg board; the
# rest as in lift_fmb_fused_pcd. Launch with the piece and, for another variant, the scene
# representation (fused_pcd_phased takes the mode phased or targeted):
#   python train.py --config-name=experiment/insert_fmb_fused_pcd task.piece=hexagon_large_h100 [scene_representation=fused_pcd_sparse]
#   python train.py --config-name=experiment/insert_fmb_fused_pcd task.piece=hexagon_medium_h100 scene_representation=fused_pcd_phased [scene_representation.roi_selection=targeted]
defaults:
  - /experiment/lift_fmb_fused_pcd
  - override /task: insert_fmb
  - _self_

name: insert_fmb_fused_pcd

data:
  # per piece and scene representation, a directory of datasets, one per recording
  dataset_path: ${repo_root:}/datasets/insert_fmb/${scene_representation.name}/${task.piece}
  num_train_episodes: 450   # of 500
